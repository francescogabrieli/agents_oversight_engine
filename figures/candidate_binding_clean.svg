<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Candidate identity and binding</title>
  <desc>The external proposal payload digest, complete evidence snapshot digest and evidence selection digest converge on one governed candidate identity. Evidence, Semantic Judge, OPA and Human Review bind their assessments and decisions to that same candidate. Changing the proposal or evidence context produces a new identity; previous assessments and authorizations cannot be reused for it. Arrows describe identity binding, not execution order.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#425466"/>
    </marker>
    <marker id="change-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bd771f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 31px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #5d6a7d; }
      .heading { font-size: 17px; font-weight: 600; fill: #536174; letter-spacing: 1px; }
      .label { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .note { font-size: 18px; fill: #536174; text-anchor: middle; }
      .node { stroke-width: 2; }
      .runtime { fill: #e8f0fe; stroke: #3568a8; }
      .evidence { fill: #e8f5ec; stroke: #39845a; }
      .policy { fill: #f0eaff; stroke: #7653b8; }
      .human { fill: #fff1d6; stroke: #bd771f; }
      .panel { fill: #f8fafc; stroke: #b8c2cf; stroke-width: 2; }
      .line { fill: none; stroke: #425466; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #425466; stroke-width: 2.5; marker-end: url(#arrow); }
      .change { fill: none; stroke: #bd771f; stroke-width: 2.5; marker-end: url(#change-arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="58" class="title">Candidate identity and binding</text>
  <text x="60" y="90" class="subtitle">Assessments and decisions bind to the proposal and its evidence context.</text>

  <rect x="45" y="135" width="1510" height="465" rx="20" class="panel"/>
  <text x="80" y="177" class="heading">THREE RELATED IDENTITIES</text>
  <text x="1160" y="177" class="heading">SAME CANDIDATE</text>

  <!-- Three independently identified inputs converge on a single binding. -->
  <rect x="80" y="220" width="355" height="88" class="node runtime"/>
  <text x="257.5" y="256" class="label">ExternalOperationProposal</text>
  <text x="257.5" y="283" class="note">payload digest</text>
  <rect x="80" y="350" width="355" height="88" class="node evidence"/>
  <text x="257.5" y="386" class="label">Evidence snapshot</text>
  <text x="257.5" y="413" class="note">snapshot digest</text>
  <rect x="80" y="480" width="355" height="88" class="node evidence"/>
  <text x="257.5" y="516" class="label">Evidence selection</text>
  <text x="257.5" y="543" class="note">selection digest</text>

  <path d="M435 264 H510 V394" class="line"/>
  <path d="M435 394 H510" class="line"/>
  <path d="M435 524 H510 V394" class="line"/>
  <circle cx="510" cy="394" r="4.5" fill="#425466"/>
  <path d="M510 394 H600" class="arrow"/>

  <rect x="610" y="320" width="390" height="148" class="node runtime"/>
  <text x="805" y="365" class="label">Governed candidate identity</text>
  <text x="805" y="404" class="note">proposal + snapshot + selection</text>
  <text x="805" y="438" class="note">exact evaluated version</text>

  <!-- Shared identity references: these are not pipeline or invocation arrows. -->
  <path d="M1000 394 H1080" class="line"/>
  <path d="M1080 252 V534" class="line"/>
  <circle cx="1080" cy="394" r="4.5" fill="#425466"/>
  <path d="M1080 252 H1150" class="arrow"/>
  <path d="M1080 346 H1150" class="arrow"/>
  <path d="M1080 440 H1150" class="arrow"/>
  <path d="M1080 534 H1150" class="arrow"/>

  <rect x="1160" y="220" width="310" height="64" class="node runtime"/>
  <text x="1315" y="260" class="label">Evidence</text>
  <rect x="1160" y="314" width="310" height="64" class="node evidence"/>
  <text x="1315" y="354" class="label">Semantic Judge</text>
  <rect x="1160" y="408" width="310" height="64" class="node policy"/>
  <text x="1315" y="448" class="label">OPA</text>
  <rect x="1160" y="502" width="310" height="64" class="node human"/>
  <text x="1315" y="542" class="label">Human Review</text>

  <!-- An edit creates a new version; historical records remain auditable. -->
  <rect x="45" y="665" width="1510" height="185" rx="20" class="panel"/>
  <path d="M805 468 V628 H257.5 V686" class="change" stroke-dasharray="7 7"/>
  <text x="550" y="654" class="note">on modification</text>
  <rect x="80" y="696" width="355" height="118" class="node human"/>
  <text x="257.5" y="744" class="label">Modified proposal</text>
  <text x="257.5" y="776" class="label">or evidence context</text>
  <path d="M435 755 H600" class="change"/>
  <rect x="610" y="696" width="390" height="118" class="node human"/>
  <text x="805" y="744" class="label">New candidate identity</text>
  <text x="805" y="779" class="note">changed digest / new binding</text>
  <path d="M1000 755 H1120" class="change"/>
  <rect x="1130" y="696" width="380" height="118" class="node human"/>
  <text x="1320" y="732" class="label">Previous assessments /</text>
  <text x="1320" y="764" class="label">authorizations cannot be reused</text>
  <text x="1320" y="792" class="note">for the new candidate</text>
</svg>
