<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <title>Evidence and audit trail</title>
  <desc>A read-only tool request becomes a concrete observation, updates canonical task state, and feeds both governance facts and trace artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#425466"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 31px; font-weight: 600; }
      .subtitle { font-size: 17px; fill: #5d6a7d; }
      .node-title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .node-note { font-size: 14px; fill: #5d6a7d; text-anchor: middle; }
      .node { stroke-width: 2; rx: 14; }
      .runtime { fill: #e8f0fe; stroke: #3568a8; }
      .evidence { fill: #e8f5ec; stroke: #39845a; }
      .audit { fill: #f0eaff; stroke: #7653b8; }
      .arrow { fill: none; stroke: #425466; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #425466; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="60" y="58" class="title">From read-only capability to auditable evidence</text>
  <text x="60" y="88" class="subtitle">Only concrete observations enter canonical state; the same state feeds governance and trace construction.</text>

  <rect x="60" y="245" width="205" height="90" class="node runtime"/>
  <text x="162" y="282" class="node-title">Actor request</text>
  <text x="162" y="307" class="node-note">typed read-only tool</text>

  <rect x="345" y="245" width="220" height="90" class="node runtime"/>
  <text x="455" y="282" class="node-title">Tool Gateway</text>
  <text x="455" y="307" class="node-note">validated adapter</text>

  <rect x="645" y="245" width="220" height="90" class="node evidence"/>
  <text x="755" y="282" class="node-title">Concrete observation</text>
  <text x="755" y="307" class="node-note">content + optional locator</text>

  <rect x="945" y="245" width="220" height="90" class="node evidence"/>
  <text x="1055" y="282" class="node-title">TaskState</text>
  <text x="1055" y="307" class="node-note">evidence, scratchpad, trajectory</text>

  <rect x="1270" y="160" width="250" height="80" class="node evidence"/>
  <text x="1395" y="194" class="node-title">Governance facts</text>
  <text x="1395" y="217" class="node-note">evidence + trajectory</text>

  <rect x="1270" y="390" width="250" height="80" class="node audit"/>
  <text x="1395" y="424" class="node-title">Trace artifacts</text>
  <text x="1395" y="447" class="node-note">step + governance records</text>

  <path d="M265 290 H335" class="arrow"/>
  <path d="M565 290 H635" class="arrow"/>
  <path d="M865 290 H935" class="arrow"/>
  <path d="M1165 290 H1210 V200 H1260" class="arrow"/>
  <path d="M1165 290 H1210 V430 H1260" class="arrow"/>

  <text x="800" y="570" class="node-note">Hidden reasoning is not used as audit evidence.</text>
</svg>
