<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <title>Asynchronous human review and checkpointed runtime resume</title>
  <desc>Sequence diagram of LangGraph interrupt, durable checkpoint, dashboard snapshot, typed human decision, request-bound inbox delivery, and CLI-owned Command resume.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#425466"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 650; }
      .subtitle { font-size: 18px; fill: #5d6a7d; }
      .lane-title { font-size: 19px; font-weight: 600; text-anchor: middle; }
      .lane-note { font-size: 14px; fill: #5d6a7d; text-anchor: middle; }
      .event { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 15px; fill: #5d6a7d; text-anchor: middle; }
      .section { font-size: 16px; font-weight: 650; letter-spacing: 1px; fill: #526071; }
      .card-title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .card-note { font-size: 15px; fill: #5d6a7d; text-anchor: middle; }
      .lifeline { stroke: #aeb8c4; stroke-width: 2; stroke-dasharray: 7 8; }
      .message { fill: none; stroke: #425466; stroke-width: 2.4; marker-end: url(#arrow); }
      .reply { fill: none; stroke: #718096; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .panel { fill: #f8fafc; stroke: #b8c2cf; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#ffffff"/>
  <text x="60" y="60" class="title">Asynchronous HITL review and runtime resume</text>
  <text x="60" y="94" class="subtitle">The dashboard delivers a typed decision; the CLI owner alone resumes the checkpointed LangGraph thread.</text>

  <rect x="42" y="145" width="1716" height="815" rx="20" class="panel"/>
  <rect x="65" y="170" width="190" height="70" fill="#e8f0fe" stroke="#3568a8" stroke-width="2"/>
  <rect x="355" y="170" width="190" height="70" fill="#f0eaff" stroke="#7653b8" stroke-width="2"/>
  <rect x="645" y="170" width="190" height="70" fill="#f0eaff" stroke="#7653b8" stroke-width="2"/>
  <rect x="935" y="170" width="190" height="70" fill="#e8f5ec" stroke="#39845a" stroke-width="2"/>
  <rect x="1225" y="170" width="190" height="70" fill="#fff1d6" stroke="#bd771f" stroke-width="2"/>
  <rect x="1515" y="170" width="190" height="70" fill="#f0eaff" stroke="#7653b8" stroke-width="2"/>
  <text x="160" y="202" class="lane-title">CLI runtime owner</text>
  <text x="160" y="223" class="lane-note">LangGraph execution</text>
  <text x="450" y="202" class="lane-title">Checkpointer</text>
  <text x="450" y="223" class="lane-note">canonical thread state</text>
  <text x="740" y="202" class="lane-title">Artifact store</text>
  <text x="740" y="223" class="lane-note">review snapshot</text>
  <text x="1030" y="202" class="lane-title">Dashboard</text>
  <text x="1030" y="223" class="lane-note">control plane</text>
  <text x="1320" y="202" class="lane-title">Human reviewer</text>
  <text x="1320" y="223" class="lane-note">typed decision</text>
  <text x="1610" y="202" class="lane-title">Decision inbox</text>
  <text x="1610" y="223" class="lane-note">durable delivery</text>

  <line x1="160" y1="252" x2="160" y2="935" class="lifeline"/>
  <line x1="450" y1="252" x2="450" y2="935" class="lifeline"/>
  <line x1="740" y1="252" x2="740" y2="935" class="lifeline"/>
  <line x1="1030" y1="252" x2="1030" y2="935" class="lifeline"/>
  <line x1="1320" y1="252" x2="1320" y2="935" class="lifeline"/>
  <line x1="1610" y1="252" x2="1610" y2="935" class="lifeline"/>

  <path d="M170 305 H440" class="message"/>
  <text x="305" y="286" class="event">1 · interrupt()</text>
  <text x="305" y="328" class="small">request ID + allowed decisions</text>

  <path d="M170 375 H730" class="message"/>
  <text x="450" y="357" class="event">2 · persist review snapshot</text>

  <path d="M1020 445 H750" class="message"/>
  <text x="885" y="427" class="event">3 · read pending review</text>

  <path d="M1310 515 H1040" class="message"/>
  <text x="1175" y="497" class="event">4 · select typed decision</text>

  <path d="M1040 585 H1600" class="message"/>
  <text x="1320" y="567" class="event">5 · validate + enqueue</text>
  <text x="1320" y="608" class="small">thread ID + exact request ID</text>

  <path d="M1600 655 H1040" class="reply"/>
  <text x="1320" y="637" class="event">6 · accepted for delivery</text>

  <path d="M170 725 H1600" class="message"/>
  <text x="885" y="707" class="event">7 · claim exact request under owner lease</text>

  <path d="M1600 795 H170" class="reply"/>
  <text x="885" y="777" class="event">8 · return request-bound command</text>

  <path d="M170 865 H440" class="message"/>
  <text x="305" y="847" class="event">9 · Command(resume=…)</text>

  <path d="M440 925 H170" class="reply"/>
  <text x="305" y="907" class="event">10 · same thread resumes</text>

  <rect x="42" y="986" width="1716" height="138" rx="20" class="panel"/>
  <text x="75" y="1020" class="section">AUTHORITY BOUNDARY</text>
  <text x="305" y="1060" class="card-title">Checkpointer</text>
  <text x="305" y="1086" class="card-note">only resumable runtime state</text>
  <text x="900" y="1060" class="card-title">Dashboard + inbox</text>
  <text x="900" y="1086" class="card-note">decision presentation and delivery</text>
  <text x="1495" y="1060" class="card-title">CLI owner</text>
  <text x="1495" y="1086" class="card-note">only process applying resume</text>
  <line x1="585" y1="1040" x2="585" y2="1095" stroke="#d3dae3" stroke-width="1.5"/>
  <line x1="1215" y1="1040" x2="1215" y2="1095" stroke="#d3dae3" stroke-width="1.5"/>
  <text x="900" y="1154" class="small">Review accepted by the inbox is not the same as run completion.</text>
</svg>
